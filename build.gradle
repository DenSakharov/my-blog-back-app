plugins {
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

dependencies {
    implementation 'org.springframework:spring-context:6.2.5'
    implementation 'org.springframework:spring-webmvc:6.2.5'
    implementation 'org.springframework:spring-jdbc:6.2.5'
    implementation 'org.springframework:spring-tx:6.2.5'

    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.39'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'org.flywaydb:flyway-core:11.3.4'
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'com.zaxxer:HikariCP:6.2.1'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    testImplementation 'org.springframework:spring-test:6.2.5'
    testImplementation 'net.datafaker:datafaker:2.4.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
}

test {
    useJUnitPlatform()
}